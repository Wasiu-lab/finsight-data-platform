[project]
name = "finsight-data-platform"
version = "0.1.0"
description = "Open financial data platform on SEC EDGAR and market data"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
